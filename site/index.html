<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F2F2">
<meta name="robots" content="noindex, nofollow">
<title>Central · Gestão Sem Caos</title>
<link rel="icon" href="./icone.svg">
<style>
  @font-face { font-family: "GSC Jakarta"; font-style: normal; font-display: swap; font-weight: 200 800; src: url(./fonte.woff2) format("woff2-variations"); }
  :root {
    --laranja: #F24505; --laranja-medio: #F2752E; --laranja-claro: #FF9E40; --pessego: #FCBA75; --azul: #334F73; --azul-escuro: #122940;
    --preto: #141414; --cinza: #F2F2F2; --branco: #FFFFFF;
    --linha: rgba(18, 41, 64, .08); --suave: rgba(51, 79, 115, .85);
    --fonte: "GSC Jakarta", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--cinza); color: var(--azul-escuro); font: 400 14px/1.45 var(--fonte); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  code { font: 600 13px/1.2 ui-monospace, "SF Mono", Menlo, monospace; }

  /* entrada */
  .entrada { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .cartao { background: var(--branco); border-radius: 18px; padding: 20px; box-shadow: 0 1px 2px rgba(18, 41, 64, .05), 0 10px 28px rgba(18, 41, 64, .06); }
  .cartao-entrada { width: 100%; max-width: 360px; padding: 28px 24px 20px; }
  .logo-svg { display: flex; align-items: center; gap: 10px; color: var(--azul-escuro); }
  .logo-svg svg { height: 22px; width: auto; }
  .logo-svg span { font-size: 12px; font-weight: 700; color: var(--laranja); letter-spacing: .02em; text-transform: uppercase; padding-left: 10px; border-left: 1px solid var(--linha); }
  .cartao-entrada .logo { margin-bottom: 22px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 700; margin: 0 0 12px; letter-spacing: -.005em; }
  .sub { font-size: 13px; color: var(--suave); margin: 0 0 18px; }
  .campo { display: block; margin-bottom: 12px; }
  .campo span { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  input { width: 100%; font: 500 14px/1.2 var(--fonte); color: var(--azul-escuro); background: var(--cinza); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s, background .15s; }
  input:focus { border-color: var(--laranja-medio); background: var(--branco); }
  .botao { width: 100%; margin-top: 4px; font: 700 14px/1 var(--fonte); color: var(--preto); background: var(--laranja); border: 0; border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: filter .15s; }
  .botao:hover { filter: brightness(1.06); }
  .botao:disabled { opacity: .6; cursor: default; }
  .botao-auto { width: auto; margin: 0; white-space: nowrap; }
  .botao-mini { display: inline-flex; align-items: center; font: 600 12px/1 var(--fonte); color: var(--azul-escuro); background: var(--cinza); border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .botao-mini:hover { background: rgba(252, 186, 117, .45); }
  .botao-mini.perigo { color: var(--laranja); }
  .link { background: none; border: 0; padding: 0; font-size: 12.5px; font-weight: 600; color: var(--azul); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  :is(.botao, .botao-mini, .link, .chip, .aba):focus-visible { outline: 2px solid var(--azul-escuro); outline-offset: 2px; }
  .erro { font-size: 13px; font-weight: 600; color: var(--laranja); margin: 4px 0 8px; }
  .aviso { background: rgba(252, 186, 117, .3); border-radius: 12px; padding: 11px 13px; margin-bottom: 14px; font-size: 13px; }
  .aviso.ok { background: rgba(51, 79, 115, .1); }
  .rodape { margin-top: 14px; text-align: center; }

  /* principal */
  .pagina { max-width: 860px; margin: 0 auto; padding: 18px 16px 48px; }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .quem { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--suave); min-width: 0; }
  .quem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .abas { display: flex; gap: 4px; margin-bottom: 14px; }
  .aba { border: 0; background: none; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--suave); cursor: pointer; }
  .aba[aria-selected="true"] { background: var(--azul-escuro); color: var(--branco); }
  #corpo > .cartao, #lista > .cartao { margin-bottom: 12px; }

  .criar-linha { display: flex; gap: 8px; }
  .criar-validade { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .criar-validade input { width: auto; padding: 6px 10px; font-size: 13px; }
  .rotulo { font-size: 12px; font-weight: 600; color: var(--suave); margin-right: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--linha); background: var(--branco); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--azul-escuro); }
  .chip:hover { border-color: var(--pessego); }
  .chip[aria-checked="true"] { background: var(--azul-escuro); border-color: var(--azul-escuro); color: var(--branco); }

  .criado { margin-top: 14px; border-radius: 14px; background: rgba(252, 186, 117, .18); padding: 14px; }
  .criado-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .nota { font-size: 12px; color: var(--suave); margin: 2px 0 10px; }
  .credencial { display: flex; align-items: center; gap: 10px; background: var(--branco); border-radius: 10px; padding: 8px 8px 8px 12px; margin-bottom: 6px; }
  .credencial span { width: 44px; font-size: 12px; color: var(--suave); }
  .credencial code { flex: 1; font-size: 15px; user-select: all; }
  .mensagem { white-space: pre-wrap; font: 400 12.5px/1.5 var(--fonte); background: var(--branco); border-radius: 10px; padding: 10px 12px; margin: 10px 0; color: var(--azul); }
  .criado-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .linhas { list-style: none; margin: 0; padding: 0; }
  .linha { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 10px 0; border-top: 1px solid var(--linha); }
  .linha:first-child { border-top: 0; padding-top: 2px; }
  .linha-txt { flex: 1; min-width: 220px; }
  .linha-txt b { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .linha-txt b code { font-size: 12px; font-weight: 500; color: var(--suave); }
  .linha-txt span { display: block; font-size: 12px; color: var(--suave); margin-top: 2px; }
  .status { font-style: normal; font-weight: 600; }
  .status.ativo { color: var(--azul-escuro); }
  .status.ativo::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--laranja); margin-right: 6px; vertical-align: 1px; }
  .status.expirado { color: var(--suave); }
  .status.revogado { color: var(--laranja); }
  .acoes { display: flex; gap: 6px; opacity: .0; transition: opacity .15s; }
  .linha:hover .acoes, .linha:focus-within .acoes { opacity: 1; }
  @media (hover: none) { .acoes { opacity: 1; } }
  .menu-estender { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0 2px; }
  .menu-data { display: flex; gap: 6px; align-items: center; }
  .menu-data input { width: auto; padding: 5px 8px; font-size: 12.5px; }
  .vazio { font-size: 13px; color: var(--suave); margin: 0; }

  /* chave de leitura do uso (aba BIs) */
  .ligacao { color: var(--suave); }
  .ligacao.ok { color: var(--azul-escuro); }
  .ligacao.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--azul); margin-right: 6px; vertical-align: 1px; }
  .selo-espera { white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--laranja); background: rgba(252, 186, 117, .3); border-radius: 999px; padding: 2px 8px; }
  .aprovacao { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .aprovacao .erro { flex-basis: 100%; margin: 0; }
  .botao-mini.forte { background: var(--laranja); color: var(--preto); }
  .plano-b { flex-basis: 100%; font-size: 12px; }
  .plano-b summary { font-size: 12px; color: var(--suave); font-weight: 600; margin-bottom: 6px; }
  .chave-uso { flex-basis: 100%; background: var(--cinza); border-radius: 12px; padding: 10px 12px; }
  .chave-topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .chave-estado { font-size: 12px; font-weight: 600; color: var(--laranja); }
  .chave-estado.ok { color: var(--azul-escuro); }
  .chave-estado.ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--azul); margin-right: 6px; vertical-align: 1px; }
  .chave-linha { display: flex; gap: 6px; align-items: center; }
  .chave-linha input { flex: 1; min-width: 0; background: var(--branco); padding: 8px 10px; font-size: 13px; }
  .chave-linha .botao-mini { background: var(--branco); }
  .chave-uso .nota { margin: 6px 0 0; }

  /* aba Uso */
  select { font: 600 13px/1.2 var(--fonte); color: var(--azul-escuro); background: var(--cinza); border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; max-width: 100%; }
  select:focus-visible { outline: 2px solid var(--azul-escuro); outline-offset: 2px; }
  .uso-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .uso-bi { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .uso-datas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .uso-datas input { width: auto; padding: 6px 10px; font-size: 13px; }
  .uso-controles { margin-bottom: 12px; }
  .uso-relatorio { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  .uso-relatorio > * { min-width: 0; margin: 0; }
  .uso-cabeca { padding: 6px 2px 0; }
  .uso-cabeca .sub { margin: 0; }
  .uso-secao { margin: 6px 2px 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  .uso-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .uso-kpi { background: var(--branco); border-radius: 16px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(18, 41, 64, .05); }
  .uso-kpi b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .uso-kpi span { font-size: 12px; color: var(--suave); }
  .uso-achados { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13.5px; }
  .uso-achados li { display: flex; gap: 10px; align-items: flex-start; }
  .uso-achados b { font-weight: 700; }
  .ponto { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; }
  .ponto-laranja { background: var(--laranja); } .ponto-claro { background: var(--laranja-claro); } .ponto-azul { background: var(--azul); }
  .uso-tabela { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .uso-tabela table { border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums; }
  .uso-tabela th { font-size: 10.5px; color: var(--suave); font-weight: 600; text-align: center; padding: 0 1px; line-height: 1.25; }
  .uso-tabela th.nome { text-align: left; }
  .uso-tabela td.nome { font-weight: 600; font-size: 13px; white-space: nowrap; padding-right: 8px; position: sticky; left: 0; background: var(--branco); z-index: 1; }
  .uso-tabela td.nome small { display: block; font-weight: 500; color: var(--suave); font-size: 11px; }
  .uso-tabela td.q { min-width: 34px; height: 32px; border-radius: 7px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--azul); }
  .q0 { background: var(--cinza); } .q1 { background: rgba(252, 186, 117, .45); } .q2 { background: var(--pessego); }
  .q3 { background: var(--laranja-medio); } .uso-tabela td.q3, .uso-tabela td.q4 { color: var(--branco); } .q4 { background: var(--laranja); }
  .uso-tabela td.total { background: none; color: var(--azul-escuro); }
  .uso-legenda { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--suave); margin-top: 10px; }
  .uso-legenda i { width: 16px; height: 12px; border-radius: 4px; display: inline-block; }
  .uso-pessoas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 12px; }
  .uso-pessoa { display: grid; gap: 12px; min-width: 0; margin: 0 !important; }
  .uso-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .uso-topo h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
  .uso-topo .nota { margin: 2px 0 0; }
  .selo { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .selo-ativa { background: var(--azul-escuro); color: var(--branco); }
  .selo-parada { background: var(--pessego); color: var(--azul-escuro); }
  .selo-nunca { background: var(--laranja); color: var(--preto); }
  .uso-numeros { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--suave); }
  .uso-numeros b { color: var(--azul-escuro); font-variant-numeric: tabular-nums; }
  .rot { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 700; margin-bottom: 4px; }
  .uso-lista { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .uso-lista li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--linha); padding: 4px 0; }
  .uso-lista li span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .uso-lista li span:last-child { color: var(--suave); font-variant-numeric: tabular-nums; }
  .uso-horas { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 40px; }
  .uso-horas i { background: var(--laranja); border-radius: 2px 2px 0 0; min-height: 1px; opacity: .85; }
  .uso-eixo { display: flex; justify-content: space-between; font-size: 10px; color: var(--suave); }
  details summary { cursor: pointer; font-weight: 600; color: var(--azul); }
  details summary:focus-visible { outline: 2px solid var(--azul-escuro); outline-offset: 3px; border-radius: 6px; }
  .uso-rodape { padding: 0 2px; }
  @media (max-width: 560px) {
    .criar-linha { flex-direction: column; }
    .botao-auto { width: 100%; }
    .quem span { display: none; }
    .abas { overflow-x: auto; }
    .chave-linha { flex-wrap: wrap; }
    .chave-linha input { flex-basis: 100%; }
    .uso-kpi b { font-size: 21px; }
  }
