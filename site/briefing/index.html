<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F2">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Briefing · Gestão Sem Caos</title>
<link rel="icon" href="../icone.svg">
<style>
  /* Briefing da implantação: uma página, um cartão por pergunta, salva sozinho. Mesmos tokens da Central. */
  @font-face { font-family: "GSC Jakarta"; font-style: normal; font-display: swap; font-weight: 200 800; src: url(../fonte.woff2) format("woff2-variations"); }
  :root {
    --laranja: #F24505; --laranja-forte: #C43803; --laranja-medio: #F2752E; --pessego: #FCBA75; --azul: #334F73; --azul-escuro: #122940;
    --preto: #141414; --cinza: #F2F2F2; --branco: #FFFFFF; --linha: rgba(18, 41, 64, .10); --suave: rgba(51, 79, 115, .88);
    --fonte: "GSC Jakarta", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--cinza); color: var(--azul-escuro); font: 400 15px/1.5 var(--fonte); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  .miolo { max-width: 720px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .marca { display: flex; align-items: center; gap: 10px; margin: 4px 0 22px; font-size: 12px; font-weight: 700; color: var(--laranja-forte); letter-spacing: .04em; text-transform: uppercase; }
  .marca img { width: 28px; height: 28px; }
  h1 { font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance; }
  .lead { color: var(--suave); margin: 0 0 18px; max-width: 60ch; }
  .cartao { background: var(--branco); border-radius: 18px; padding: 22px 20px; box-shadow: 0 1px 2px rgba(18, 41, 64, .05), 0 10px 28px rgba(18, 41, 64, .06); margin-bottom: 14px; }
  .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: rgba(242, 117, 46, .14); color: var(--laranja-forte); font-size: 12px; font-weight: 800; margin-bottom: 10px; }
  .cartao.feito .num { background: var(--azul-escuro); color: var(--branco); }
  h2 { font-size: 18px; line-height: 1.25; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance; }
  .porque { font-size: 13px; color: var(--suave); margin: 0 0 16px; }
  .campo { display: block; margin-top: 14px; }
  .campo > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .ajuda { display: block; font-size: 12px; color: var(--suave); margin: -2px 0 6px; }
  input[type=text], textarea { width: 100%; font-size: 16px; line-height: 1.4; background: var(--cinza); border: 1px solid transparent; border-radius: 12px; padding: 11px 13px; outline: none; transition: border-color .15s, background .15s; }
  textarea { min-height: 92px; resize: vertical; }
  input[type=text]:focus, textarea:focus { border-color: var(--laranja-medio); background: var(--branco); }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; }
  .opcao { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linha); background: var(--branco); border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; min-height: 40px; }
  .opcao input { position: absolute; opacity: 0; pointer-events: none; }
  .opcao:has(input:checked) { background: var(--azul-escuro); border-color: var(--azul-escuro); color: var(--branco); }
  .opcao:has(input:focus-visible) { outline: 2px solid var(--laranja-medio); outline-offset: 2px; }
  .rodape { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, .92); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); border-top: 1px solid var(--linha); }
  .rodape .dentro { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .progresso { flex: 1; min-width: 0; }
  .progresso small { display: block; font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trilho { height: 6px; border-radius: 99px; background: #e9ecef; overflow: hidden; margin-top: 5px; }
  .trilho i { display: block; height: 100%; width: 0; background: var(--azul-escuro); border-radius: 99px; transition: width .4s cubic-bezier(.4, 0, .2, 1); }
  .botao { font-weight: 700; font-size: 15px; color: var(--preto); background: var(--laranja); border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; white-space: nowrap; }
  .botao:disabled { opacity: .55; cursor: default; }
  .botao:focus-visible { outline: 2px solid var(--azul-escuro); outline-offset: 2px; }
  .estado { text-align: center; padding: 64px 8px; }
  .estado p { color: var(--suave); }
  .pronto { border: 1.5px solid var(--azul-escuro); }
  @media (prefers-reduced-motion: reduce) { .trilho i, input, textarea { transition: none; } }
</style>
</head>
<body>
<main class="miolo" id="raiz">
  <div class="marca"><img src="../icone.svg" alt=""><span>Gestão Sem Caos · implantação do BI</span></div>
  <div class="estado" id="carregando" role="status"><p>Abrindo o seu briefing…</p></div>
</main>
<div class="rodape" id="rodape" hidden>
  <div class="dentro">
    <div class="progresso"><small id="contagem" aria-live="polite">0 de 12 respondidas</small><div class="trilho" aria-hidden="true"><i id="barra"></i></div></div>
    <button type="button" class="botao" id="enviar">Enviar respostas</button>
  </div>
</div>
<script src="../perguntas-briefing.js" charset="utf-8"></script>
<script src="./briefing.js" charset="utf-8"></script>
</body>
</html>
