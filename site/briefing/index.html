<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCDFE4">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Briefing · Gestão Sem Caos</title>
<link rel="icon" href="../icone.svg">
<style>
  /* Briefing da implantação: uma pergunta por tela, no visual das propostas da Gestão Sem Caos (Satoshi, cartão claro sobre a mesa,
     títulos grandes, botões em pílula, laranja só no que importa). Salva sozinho a cada resposta. */
  @font-face { font-family: "Satoshi"; font-weight: 400; font-style: normal; font-display: swap; src: url(./Satoshi-Regular.otf) format("opentype"); }
  @font-face { font-family: "Satoshi"; font-weight: 500; font-style: normal; font-display: swap; src: url(./Satoshi-Medium.otf) format("opentype"); }
  :root {
    --ink: #141414; --text: #3A3A3C; --gray: #6E6E73; --gray-2: #8E8E93; --line: #E4E4E9;
    --paper: #FFFFFF; --panel: #F5F5F7; --desk: #DCDFE4;
    --navy: #13283F; --navy-soft: #C3CDDA;
    --orange: #F2762E; --orange-ink: #C43803; --orange-soft: #FDEBDD; --ok: #2E7D4F; --ok-soft: #E3F2E8;
    --font: "Satoshi", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --curva: cubic-bezier(.2, .7, .2, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--desk); color: var(--ink); font: 400 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  h1, h2, p { margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

  .mesa { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .folha { width: 100%; max-width: 760px; min-height: min(680px, calc(100dvh - 48px)); background: var(--paper); border-radius: 22px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 18px 48px rgba(20, 20, 20, .08); display: flex; flex-direction: column; overflow: hidden; }
  .folha.escura { background: var(--navy); color: #FFFFFF; }

  .topo { display: flex; align-items: center; gap: 16px; padding: 22px 32px 0; }
  .topo img { height: 20px; width: auto; display: block; }
  .topo .passo { margin-left: auto; font-size: 14px; color: var(--gray-2); font-variant-numeric: tabular-nums; }
  .trilho { height: 3px; background: var(--panel); margin: 18px 32px 0; border-radius: 3px; overflow: hidden; }
  .trilho i { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 3px; transition: width .6s var(--curva); }

  .tela { flex: 1; display: flex; flex-direction: column; gap: 26px; padding: 44px 64px 28px; }
  .tela.entra { animation: entra .32s var(--curva); }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .eyebrow { font-size: 15px; font-weight: 500; color: var(--orange-ink); }
  .escura .eyebrow { color: var(--orange); }
  h1 { font-size: 40px; font-weight: 500; letter-spacing: -.035em; line-height: 1.08; text-wrap: balance; }
  .sub { font-size: 18px; color: var(--gray); max-width: 52ch; margin-top: -12px; }
  .escura .sub { color: var(--navy-soft); }
  .meta { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 4px; }
  .meta div { display: flex; flex-direction: column; gap: 2px; }
  .meta span { font-size: 13px; color: var(--navy-soft); }
  .meta b { font-size: 16px; font-weight: 500; }

  .campos { display: flex; flex-direction: column; gap: 22px; }
  .campo { display: flex; flex-direction: column; gap: 8px; }
  .campo > .rot { font-size: 15px; font-weight: 500; color: var(--text); }
  .campo > .ajuda { font-size: 14px; color: var(--gray-2); margin-top: -4px; }
  .duas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 16px; }
  .entrada { width: 100%; font-size: 17px; line-height: 1.4; color: var(--ink); background: #FAFAFB; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 14px 16px; outline: none; transition: border-color .2s, background .2s; }
  .entrada:focus { border-color: var(--orange); background: #FFFFFF; }
  textarea.entrada { min-height: 120px; resize: vertical; }
  .opcoes { display: grid; gap: 10px; }
  .opcao { position: relative; display: flex; align-items: center; gap: 14px; padding: 15px 18px; border: 1.5px solid var(--line); border-radius: 16px;
    background: var(--paper); font-size: 17px; cursor: pointer; user-select: none; transition: border-color .2s, background .2s; }
  .opcao:hover { border-color: #CFCFD6; }
  .opcao input { position: absolute; opacity: 0; pointer-events: none; }
  .opcao .marca { flex: none; width: 22px; height: 22px; border: 1.5px solid #C7C7CC; border-radius: 50%; display: grid; place-items: center; transition: all .2s; }
  .opcao.varias .marca { border-radius: 7px; }
  .opcao .marca::after { content: ""; width: 10px; height: 6px; border: 2px solid #FFFFFF; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; transition: opacity .15s; }
  .opcao:has(input:checked) { border-color: var(--orange); background: var(--orange-soft); }
  .opcao:has(input:checked) .marca { background: var(--orange); border-color: var(--orange); }
  .opcao:has(input:checked) .marca::after { opacity: 1; }
  .opcao:has(input:focus-visible) { outline: 2px solid var(--orange); outline-offset: 2px; }

  /* microfone como no Claude: botão redondo escuro, bem à vista; no campo grande, uma barra com a dica embaixo */
  .com-mic { display: flex; gap: 10px; align-items: center; }
  .com-mic .entrada { flex: 1; min-width: 0; }
  .com-mic.area { position: relative; display: block; }
  .com-mic.area .entrada { padding-bottom: 64px; min-height: 150px; resize: none; }
  .barra-mic { position: absolute; left: 1.5px; right: 1.5px; bottom: 1.5px; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-top: 1px solid var(--line); border-radius: 0 0 13px 13px; background: inherit; }
  .dica-mic { font-size: 14px; color: var(--gray-2); flex: 1; min-width: 0; }
  .dica-mic.on { color: var(--orange-ink); font-weight: 500; }
  .mic { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--ink); color: #FFFFFF; display: grid; place-items: center; transition: background .2s, transform .15s; }
  .mic:hover { background: #2C2C2E; }
  .mic:active { transform: scale(.94); }
  .mic.on { background: var(--orange); animation: ouvindo 1.4s ease-in-out infinite; }
  @keyframes ouvindo { 50% { box-shadow: 0 0 0 7px rgba(242, 118, 46, .22); } }
  .tabela .tabela-linha { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, .7fr) minmax(0, 1.2fr) 36px; gap: 8px; align-items: center; }
  .tabela .tabela-corpo { display: grid; gap: 8px; }
  .tabela .cabeca span { font-size: 13px; font-weight: 500; color: var(--gray); padding-left: 4px; }
  .tabela .entrada { padding: 12px 14px; }
  .tabela .tirar { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--gray-2); font-size: 20px; line-height: 1; }
  .tabela .tirar:hover { background: var(--panel); color: var(--ink); }
  .tabela .mais { justify-self: start; padding-left: 4px; color: var(--orange-ink); }
  /* abertura: tudo no centro, igual para qualquer clínica; o nome do cliente só no selo */
  .folha.abertura .topo { justify-content: center; padding-top: 36px; }
  .folha.abertura .topo img { height: 24px; }
  .folha.abertura .tela { justify-content: center; align-items: center; text-align: center; gap: 22px; padding: 32px 48px 72px; }
  .folha.abertura h1 { font-size: 48px; max-width: 14ch; }
  .folha.abertura .sub { margin-top: -6px; max-width: 44ch; font-size: 18px; }
  .selo { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #FFFFFF; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px; padding: 7px 14px; }
  .selo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
  .folha.abertura .meta { justify-content: center; gap: 0; margin: 6px 0 4px; }
  .folha.abertura .meta div { align-items: center; padding: 0 26px; gap: 2px; }
  .folha.abertura .meta div + div { border-left: 1px solid rgba(255, 255, 255, .14); }
  .folha.abertura .meta b { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
  .folha.abertura .meta span { font-size: 13px; }
  .folha.abertura .ok-grande { background: rgba(76, 200, 141, .16); }
  .folha.abertura .ok-grande::after { border-color: #4CC88D; }
  .proximos { list-style: none; counter-reset: p; margin: 6px 0 2px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 620px; text-align: left; }
  .proximos li { counter-increment: p; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .proximos li::before { content: counter(p); width: 26px; height: 26px; border-radius: 50%; background: var(--orange); color: #FFFFFF; font-size: 13px; font-weight: 500; display: grid; place-items: center; }
  .proximos b { font-size: 16px; font-weight: 500; }
  .proximos span { font-size: 14px; color: var(--navy-soft); line-height: 1.45; }
  .btn.grande { padding: 16px 40px; font-size: 17px; margin-top: 6px; }
  .nota-abertura { font-size: 14px; color: var(--navy-soft); max-width: 40ch; }
  .rodape { display: flex; align-items: center; gap: 12px; padding: 20px 64px 32px; }
  .rodape .salvo { font-size: 14px; color: var(--gray-2); display: inline-flex; align-items: center; gap: 7px; }
  .rodape .salvo.ok::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .rodape .dica { margin-left: auto; font-size: 13px; color: var(--gray-2); }
  .rodape .dica kbd { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .btn { border: 0; border-radius: 999px; padding: 14px 26px; background: var(--ink); color: #FFFFFF; font-size: 16px; font-weight: 500; transition: transform .15s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.laranja { background: var(--orange); color: #FFFFFF; }
  .btn.claro { background: #FFFFFF; color: var(--navy); }
  .btn.ghost { background: transparent; color: var(--gray); padding-inline: 10px; }
  .escura .btn.ghost { color: var(--navy-soft); }
  .rodape .principal { margin-left: 8px; }
  .rodape .dica + .principal { margin-left: 12px; }
  .ok-grande { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); display: grid; place-items: center; }
  .ok-grande::after { content: ""; width: 20px; height: 11px; border: 3px solid var(--ok); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(2px, -2px); }
  .aviso { font-size: 15px; color: var(--text); background: var(--panel); border-radius: 16px; padding: 16px 20px; }
  .carregando { margin: auto; color: var(--gray); }

  /* telas de pergunta (passada de design, 28/10): contador, campos macios, opções com letra (atalho) e rodapé limpo */
  .folha:not(.escura) .topo { padding-top: 26px; }
  .tela { gap: 28px; padding: 40px 64px 32px; }
  .contador { font-size: 15px; font-weight: 500; color: var(--gray-2); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .contador b { color: var(--orange-ink); font-weight: 500; }
  .folha:not(.escura) h1 { font-size: 38px; margin-top: -10px; }
  .folha:not(.escura) .sub { font-size: 18px; color: var(--gray); margin-top: -14px; }
  .campos { gap: 26px; }
  .campo > .rot { font-size: 15px; font-weight: 500; color: var(--ink); }
  .entrada { background: var(--panel); border-color: transparent; border-radius: 14px; padding: 15px 16px; }
  .entrada::placeholder { color: var(--gray-2); }
  .entrada:hover { background: #EFEFF2; }
  .entrada:focus { background: #FFFFFF; border-color: var(--orange); box-shadow: 0 0 0 4px rgba(242, 118, 46, .12); }
  .opcoes.duas-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opcao { gap: 12px; padding: 13px 16px 13px 12px; background: var(--panel); border-color: transparent; border-radius: 14px; }
  .opcao:hover { background: #EDEDF0; border-color: transparent; }
  .opcao .letra { flex: none; width: 28px; height: 28px; display: grid; place-items: center; font: 500 13px/1 var(--font); color: var(--gray); background: #FFFFFF; border: 1px solid #D9D9DE; border-radius: 8px; transition: all .2s; }
  .opcao .txt { flex: 1; min-width: 0; }
  .opcao .marca { margin-left: auto; width: 20px; height: 20px; border: 0; background: transparent; opacity: 0; }
  .opcao:has(input:checked) { background: var(--orange-soft); border-color: var(--orange); }
  .opcao:has(input:checked) .letra { background: var(--orange); border-color: var(--orange); color: #FFFFFF; }
  .opcao:has(input:checked) .marca { opacity: 1; background: transparent; }
  .opcao:has(input:checked) .marca::after { border-color: var(--orange-ink); }
  .rodape { border-top: 1px solid var(--line); padding: 18px 64px 24px; }
  .escura .rodape { border-top: 0; }
  .btn .seta { display: inline-block; margin-left: 10px; transition: transform .2s; }
  .btn .seta.volta { margin: 0 8px 0 0; }
  .btn:hover .seta { transform: translateX(3px); }
  .btn:hover .seta.volta { transform: translateX(-3px); }
  @media (max-width: 640px) {
    .mesa { padding: 0; align-items: stretch; }
    .folha { border-radius: 0; min-height: 100vh; min-height: 100dvh; box-shadow: none; }
    .topo { padding: max(18px, env(safe-area-inset-top)) 20px 0; }
    .trilho { margin: 14px 20px 0; }
    .tela { padding: 32px 20px 20px; gap: 22px; }
    h1 { font-size: 30px; }
    .sub { font-size: 16px; }
    .duas { grid-template-columns: minmax(0, 1fr); }
    .opcoes.duas-col { grid-template-columns: minmax(0, 1fr); }
    .tela { padding: 28px 20px 20px; gap: 24px; }
    .folha:not(.escura) h1 { font-size: 30px; }
    .folha:not(.escura) .sub { font-size: 16px; }
    .opcao .letra { display: none; }
    .folha.abertura .tela { padding: 24px 20px 48px; }
    .folha.abertura h1 { font-size: 34px; }
    .folha.abertura .meta div { padding: 0 14px; }
    .folha.abertura .meta b { font-size: 18px; }
    .btn.grande { width: 100%; }
    .proximos { grid-template-columns: minmax(0, 1fr); }
    .tabela .tabela-linha { grid-template-columns: minmax(0, 1.3fr) 64px minmax(0, 1fr) 32px; gap: 6px; }
    .tabela .entrada { padding: 11px 10px; }
    .entrada, .opcao { font-size: 16px; }
    .rodape { padding: 14px 20px max(20px, env(safe-area-inset-bottom)); position: sticky; bottom: 0; background: inherit; border-top: 1px solid var(--line); }
    .escura .rodape { border-top-color: rgba(255, 255, 255, .12); }
    .rodape .dica { display: none; }
    .rodape .principal { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .tela.entra, .mic.on { animation: none; } .trilho i, .opcao, .entrada, .btn { transition: none; } }
</style>
</head>
<body>
<main class="mesa"><div class="folha" id="folha"><p class="carregando" role="status">Abrindo o seu briefing…</p></div></main>
<script src="../perguntas-briefing.js" charset="utf-8"></script>
<script src="./briefing.js" charset="utf-8"></script>
</body>
</html>
